[package]
name = "newvcs-hasher"
version = "0.1.0"
edition = "2021"
publish = false
description = "BLAKE3 for the Worker: the same crate nv hashes with, compiled to WebAssembly"

[lib]
crate-type = ["cdylib"]

[dependencies]
blake3 = { version = "1", default-features = false, features = ["wasm32_simd"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Not part of the nv package above it.
[workspace]
