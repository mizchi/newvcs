[package]
name = "newvcs"
version = "0.0.1"
edition = "2024"
description = "Experiment: a version-control store that keeps Git's object ids but not Git's storage"
license = "MIT"
publish = false

[[bin]]
name = "nv"
path = "src/main.rs"

[dependencies]
blake3 = "1"
sha1 = "0.10"
zstd = { version = "0.13", default-features = false }
libc = "0.2"
memmap2 = "0.9"
# Git's own rules for .gitignore, from gitoxide.
gix-ignore = "0.24"
gix-glob = "0.29"
gix-attributes = "0.37"
# Git's three-way text merge, conflict markers included.
gix-merge = { version = "0.23", default-features = false, features = ["sha1"] }
imara-diff = { package = "gix-imara-diff", version = "0.3" }
bstr = "1"
# The operating system's file events, for `nv watch`.
notify = "8"
# File names as the file system and Git each spell them (NFC and NFD).
unicode-normalization = "0.1"
# Git's loose objects are zlib streams.
flate2 = "1"
# Plain HTTP only: the server is local so far.
ureq = { version = "2", default-features = false }
serde_json = "1"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1

# For working on nv: optimized, but built in parallel and incrementally, so a
# change rebuilds in seconds. Numbers in the README are measured with `release`.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = 0
